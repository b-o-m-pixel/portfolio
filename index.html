  <script>
    (function initializeThemeBeforePaint() {
      try {
        var STORAGE_KEY = 'portfolio-theme';
        var savedTheme = localStorage.getItem(STORAGE_KEY);
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : prefersDark
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();

    function ThemeToggle(buttonIdSuffix) {
      const currentTheme =
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const isDark = currentTheme === 'dark';

      return `
        <button
          type="button"
          id="theme-toggle-${buttonIdSuffix}"
          class="theme-toggle-btn js-theme-toggle"
          data-theme-toggle
          aria-pressed="${isDark ? 'true' : 'false'}"
          aria-label="Switch color theme. Current theme is ${isDark ? 'dark' : 'light'}."
          title="Toggle light or dark color theme"
        >
          <span class="js-theme-icon" aria-hidden="true" style="display:inline-flex;align-items:center;">
            ${getThemeIconSvg(currentTheme)}
          </span>
          <span class="js-theme-label">${isDark ? 'Dark' : 'Light'}</span>
        </button>
      `;
    }

    function getThemeIconSvg(theme) {
      if (theme === 'dark') {

      }
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
    }

                </li>

                .join('')}

        `;

      return `
        <section id="${credentials.id}" class="portfolio-section" aria-labelledby="credentials-heading">
          <div class="site-container">
            <div class="section-header-bar">
              <div class="eyebrow-label">${credentials.label}</div>
              <h2 id="credentials-heading" class="heading-section">${credentials.heading}</h2>
              <p class="section-intro">${credentials.intro}</p>
            </div>

            <div class="credentials-category-stack">
              <!-- Category 1: Education -->
              <div class="credentials-category-block" aria-labelledby="cat-education-heading">
                <div class="credentials-category-header">
                  <h3 id="cat-education-heading" class="heading-card">1. Education</h3>
                  <span class="editorial-item-note">Academic Degree Program</span>
                </div>
                <div class="grid-2-col">
                  ${credentials.education
                    .map(
                      (edu) => `
                    <article class="credential-card">
                      <div>
                        <div class="slot-meta-row">
                          <span class="level-badge">${edu.status}</span>
                          <span class="planned-badge">${edu.timeline}</span>
                        </div>
                        <h4 class="heading-card" style="font-size:1.08rem;">${edu.degree}</h4>
                        <p class="credential-issuer">${edu.institution}</p>
                        <p class="slot-copy">${edu.summary}</p>
                      </div>
                    </article>
                  `
                    )
                    .join('')}
                </div>
              </div>

              <!-- Category 2: Certifications (Interactive Modal Triggers) -->
              <div class="credentials-category-block" aria-labelledby="cat-certifications-heading">
                <div class="credentials-category-header">
                  <h3 id="cat-certifications-heading" class="heading-card">2. Certifications</h3>
                  <span class="editorial-item-note">Select a certification card to view credential details</span>
                </div>
                <div class="grid-2-col">
                  ${credentials.certifications
                    .map(
                      (cert) => `
                    <article class="credential-card credential-card--interactive">
                      <div>
                        <div class="slot-meta-row">
                          <span class="planned-badge">${cert.status}</span>
                          <span class="editorial-item-note">${cert.dateEarned}</span>
                        </div>
                        <h4 class="heading-card" style="font-size:1.08rem;">${cert.name}</h4>
                        <p class="credential-issuer">${cert.issuer}</p>
                        <p class="slot-copy">${cert.description}</p>
                      </div>
                      <button
                        type="button"
                        class="credential-trigger-btn js-cert-modal-trigger"
                        data-cert-id="${cert.id}"
                        aria-haspopup="dialog"
                        aria-controls="certification-modal"
                      >
                        <span>View credential details</span>
                        <span aria-hidden="true">→</span>
                      </button>
                    </article>
                  `
                    )
                    .join('')}
                </div>
              </div>

              <!-- Category 3: Courses & Technical Training -->
              <div class="credentials-category-block" aria-labelledby="cat-courses-heading">
                <div class="credentials-category-header">
                  <h3 id="cat-courses-heading" class="heading-card">3. Courses &amp; Technical Training</h3>
                  <span class="editorial-item-note">Structured Coursework &amp; Skill Development</span>
                </div>
                <div class="grid-2-col">
                  ${credentials.courses
                    .map(
                      (course) => `
                    <article class="credential-card">
                      <div>
                        <div class="slot-meta-row">
                          <span class="slot-kicker" style="margin:0;">${course.provider}</span>
                          <span class="planned-badge">${course.status}</span>
                        </div>
                        <h4 class="heading-card" style="font-size:1.08rem;">${course.title}</h4>
                        <p class="slot-copy">Focus areas: ${course.focus}</p>
                      </div>
                    </article>
                  `
                    )
                    .join('')}
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function CertificationModal() {
      return `
        <div
          id="certification-modal-backdrop"
          class="modal-backdrop"
          hidden
        >
          <div
            id="certification-modal"
            class="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="cert-modal-title"
            aria-describedby="cert-modal-description"
            tabindex="-1"
          >
            <div class="modal-header">
              <div>
                <p id="cert-modal-status" class="slot-kicker slot-kicker--accent" style="margin-bottom:0.25rem;"></p>
                <h3 id="cert-modal-title" class="heading-card"></h3>
              </div>
              <button
                type="button"
                id="cert-modal-close"
                class="modal-close-btn"
                aria-label="Close certification details modal"
              >
                <span aria-hidden="true">✕</span>
                <span>Close</span>
              </button>
            </div>

            <div class="modal-body">
              <p id="cert-modal-description" class="slot-copy" style="margin:0;"></p>

              <dl class="modal-meta-dl">
                <div>
                  <dt>Issuing Organization</dt>
                  <dd id="cert-modal-issuer"></dd>
                </div>
                <div>
                  <dt>Date Earned / Status</dt>
                  <dd id="cert-modal-date"></dd>
                </div>
                <div style="grid-column: 1 / -1;">
                  <dt>Credential ID</dt>
                  <dd id="cert-modal-credential-id" style="font-family:var(--font-mono);font-size:var(--text-xs);"></dd>
                </div>
              </dl>

              <div id="cert-modal-preview" class="modal-preview-box" aria-label="Certificate preview area"></div>
            </div>

            <div class="modal-footer">
              <span class="editorial-item-note">Press Escape or click outside to close</span>
              <div id="cert-modal-verify-container"></div>
            </div>
          </div>
        </div>
      `;
    }

    function NotesSection(notes) {
      return `
        <section id="${notes.id}" class="portfolio-section" aria-labelledby="notes-heading">
          <div class="site-container">
            <div class="section-header-bar">
              <div class="eyebrow-label">${notes.label}</div>
              <h2 id="notes-heading" class="heading-section">${notes.heading}</h2>
              <p class="section-intro">${notes.intro}</p>
            </div>

            <div class="editorial-note-box">
              <p>${notes.body}</p>
            </div>
          </div>
        </section>
      `;
    }

    function ContactSection(contact) {
      return `
        <section id="${contact.id}" class="portfolio-section portfolio-section--last" aria-labelledby="contact-heading">
          <div class="site-container">
            <div class="section-header-bar">
              <div class="eyebrow-label">${contact.label}</div>
              <h2 id="contact-heading" class="heading-section">${contact.heading}</h2>
              <p class="section-intro">${contact.intro}</p>
            </div>

            <div class="contact-links-grid" role="list" aria-label="Professional contact links">
              ${contact.methods
                .map(
                  (method) => `
                <a
                  role="listitem"
                  href="${method.href}"
                  class="contact-method-card"
                  ${method.external ? 'target="_blank" rel="noopener noreferrer"' : ''}
                >
                  <span class="contact-icon-box">
                    ${getContactIconSvg(method.type)}
                  </span>
                  <div>
                    <h3 class="contact-method-label">${method.label}</h3>
                    <p class="contact-method-value">${method.value}</p>
                  </div>
                </a>
              `
                )
                .join('')}
            </div>
          </div>
        </section>
      `;
    }

    function SiteFooter(config) {
      const currentYear = new Date().getFullYear();
      return `
        <footer id="site-footer" class="site-footer">
          <div class="site-container">
            <div class="footer-grid">
              <div>
                <a href="${config.brand.href}" class="brand-wordmark js-brand-link" data-section-target="hero">
                  <span class="brand-indicator" aria-hidden="true"></span>
                  <span>${config.brand.name}</span>
                </a>
                <p style="font-size:var(--text-sm);color:var(--text-secondary);max-width:46ch;margin:0.65rem 0 0 0;">
                  ${config.brand.roleSummary}
                </p>
              </div>

              <nav aria-label="Footer quick links" class="footer-links">
                ${config.footerLinks
                  .map(
                    (item) => `
                  <a href="${item.href}" class="nav-link" style="padding:2px 0;">
                    ${item.label}
                  </a>
                `
                  )
                  .join('')}
              </nav>
            </div>

            <div class="footer-bottom">
              <span>&copy; ${currentYear} ${config.brand.name}. All rights reserved.</span>
              <span>Data Engineering Portfolio</span>
            </div>
          </div>
        </footer>
      `;
    }

    function renderPortfolioApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      root.innerHTML = `
        ${SiteHeader(SITE_CONFIG)}
        <main id="main-content" tabindex="-1">
          ${HeroSection(SITE_CONFIG.hero)}
          ${ProjectsSection(SITE_CONFIG.projects)}
          ${AboutSection(SITE_CONFIG.about)}
          ${FocusSection(SITE_CONFIG.focus)}
          ${CredentialsSection(SITE_CONFIG.credentials)}
          ${NotesSection(SITE_CONFIG.notes)}
          ${ContactSection(SITE_CONFIG.contact)}
        </main>
        ${SiteFooter(SITE_CONFIG)}
        ${CertificationModal()}
      `;

      bindThemeToggles();
      bindMobileNavigation();
      bindScrollSpyNavigation();
      bindCertificationModal();
    }

    function bindThemeToggles() {
      const toggleButtons = document.querySelectorAll('[data-theme-toggle]');

      function applyTheme(newTheme, persist) {
        document.documentElement.setAttribute('data-theme', newTheme);
        document.documentElement.style.colorScheme = newTheme;

        if (persist) {
          try {
            localStorage.setItem('portfolio-theme', newTheme);
          } catch (e) {
            // Ignore storage errors in restricted environments
          }
        }

        const isDark = newTheme === 'dark';
        toggleButtons.forEach((btn) => {
          btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
          btn.setAttribute(
            'aria-label',
            `Switch color theme. Current theme is ${isDark ? 'dark' : 'light'}.`
          );
          const iconSpan = btn.querySelector('.js-theme-icon');
          const labelSpan = btn.querySelector('.js-theme-label');
          if (iconSpan) iconSpan.innerHTML = getThemeIconSvg(newTheme);
          if (labelSpan) labelSpan.textContent = isDark ? 'Dark' : 'Light';
        });
      }

      toggleButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const current =
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
          const next = current === 'dark' ? 'light' : 'dark';
          applyTheme(next, true);
        });
      });
    }

    function bindMobileNavigation() {
      const menuBtn = document.getElementById('mobile-menu-toggle');
      const menuPanel = document.getElementById('mobile-navigation-panel');
      const menuLabel = document.getElementById('mobile-menu-label');
      const mobileLinks = document.querySelectorAll('.js-mobile-nav-link');

      if (!menuBtn || !menuPanel) return;

      function setMenuOpen(isOpen) {
        menuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        menuBtn.setAttribute(
          'aria-label',
          isOpen ? 'Close navigation menu' : 'Open navigation menu'
        );
        if (menuLabel) {
          menuLabel.textContent = isOpen ? 'Close' : 'Menu';
        }
        menuPanel.classList.toggle('is-open', isOpen);
      }

      menuBtn.addEventListener('click', () => {
        const currentlyOpen = menuBtn.getAttribute('aria-expanded') === 'true';
        setMenuOpen(!currentlyOpen);
      });

      mobileLinks.forEach((link) => {
        link.addEventListener('click', () => {
          setMenuOpen(false);
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && menuBtn.getAttribute('aria-expanded') === 'true') {
          setMenuOpen(false);
          menuBtn.focus();
        }
      });

      document.addEventListener('click', (event) => {
        const header = document.getElementById('site-header');
        if (
          header &&
          !header.contains(event.target) &&
          menuBtn.getAttribute('aria-expanded') === 'true'
        ) {
          setMenuOpen(false);
        }
      });
    }

    function bindScrollSpyNavigation() {
      const trackedIds = SITE_CONFIG.navigation.map((item) => item.id);
      const trackedSections = trackedIds
        .map((id) => document.getElementById(id))
        .filter(Boolean);
      const allNavLinks = document.querySelectorAll('.js-nav-link, .js-mobile-nav-link');
      const brandLinks = document.querySelectorAll('.js-brand-link');

      function setActiveSection(sectionId) {
        if (!sectionId || !trackedIds.includes(sectionId)) return;
        allNavLinks.forEach((link) => {
          if (link.getAttribute('data-section-target') === sectionId) {
            link.setAttribute('aria-current', 'location');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      }

      function evaluateScrollPosition() {
        if (!trackedSections.length) return;

        const scrollY = window.scrollY || window.pageYOffset;
        const viewportHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;

        if (scrollY + viewportHeight >= documentHeight - 24) {
          setActiveSection(trackedIds[trackedIds.length - 1]);
          return;
        }

        const activationOffset = 140;
        let resolvedId = trackedIds[0];

        for (let i = 0; i < trackedSections.length; i++) {
          const rect = trackedSections[i].getBoundingClientRect();
          if (rect.top <= activationOffset) {
            resolvedId = trackedSections[i].id;
          } else {
            break;
          }
        }

        setActiveSection(resolvedId);
      }

      allNavLinks.forEach((link) => {
        link.addEventListener('click', () => {
          const targetId = link.getAttribute('data-section-target');
          if (targetId) setActiveSection(targetId);
        });
      });

      brandLinks.forEach((link) => {
        link.addEventListener('click', () => {
          setActiveSection('hero');
        });
      });

      window.addEventListener('scroll', evaluateScrollPosition, { passive: true });
      window.addEventListener('resize', evaluateScrollPosition, { passive: true });
      window.addEventListener('hashchange', () => {
        const hashId = window.location.hash.replace('#', '');
        if (trackedIds.includes(hashId)) {
          setActiveSection(hashId);
        }
      });

      evaluateScrollPosition();
    }

    function bindCertificationModal() {
      const backdrop = document.getElementById('certification-modal-backdrop');
      const dialog = document.getElementById('certification-modal');
      const closeBtn = document.getElementById('cert-modal-close');
      const triggers = document.querySelectorAll('.js-cert-modal-trigger');
      const mainContent = document.getElementById('main-content');
      const siteHeader = document.getElementById('site-header');
      const siteFooter = document.getElementById('site-footer');

      if (!backdrop || !dialog || !closeBtn) return;

      let lastFocusedTrigger = null;

      function setBackgroundInert(isInert) {
        [mainContent, siteHeader, siteFooter].forEach((el) => {
          if (!el) return;
          if (isInert) {
            el.setAttribute('inert', '');
            el.setAttribute('aria-hidden', 'true');
          } else {
            el.removeAttribute('inert');
            el.removeAttribute('aria-hidden');
          }
        });
      }

      function openModal(certId, triggerEl) {
        const cert = SITE_CONFIG.credentials.certifications.find((c) => c.id === certId);
        if (!cert) return;

        lastFocusedTrigger = triggerEl || document.activeElement;

        document.getElementById('cert-modal-status').textContent = cert.status;
        document.getElementById('cert-modal-title').textContent = cert.name;
        document.getElementById('cert-modal-description').textContent = cert.description;
        document.getElementById('cert-modal-issuer').textContent = cert.issuer;
        document.getElementById('cert-modal-date').textContent = cert.dateEarned;
        document.getElementById('cert-modal-credential-id').textContent = cert.credentialId;

        const previewEl = document.getElementById('cert-modal-preview');
        if (cert.imageUrl && cert.imageUrl.trim() !== '') {
          previewEl.innerHTML = `<img src="${cert.imageUrl}" alt="Certificate preview for ${cert.name}" />`;
        } else {
          previewEl.innerHTML = `<p class="editorial-item-note" style="margin:0;">${cert.imagePlaceholderNote}</p>`;
        }

        const verifyContainer = document.getElementById('cert-modal-verify-container');
        if (cert.verificationUrl && cert.verificationUrl.trim() !== '') {
          verifyContainer.innerHTML = `
            <a
              href="${cert.verificationUrl}"
              class="btn-primary"
              style="padding:8px 14px;font-size:var(--text-xs);"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span>Verify credential</span>
              <span aria-hidden="true">↗</span>
            </a>
          `;
        } else {
          verifyContainer.innerHTML = `
            <span class="planned-badge">Verification URL pending completion</span>
          `;
        }

        backdrop.removeAttribute('hidden');
        document.body.classList.add('modal-open');
        setBackgroundInert(true);
        closeBtn.focus();
      }

      function closeModal() {
        if (backdrop.hasAttribute('hidden')) return;
        backdrop.setAttribute('hidden', '');
        document.body.classList.remove('modal-open');
        setBackgroundInert(false);
        if (lastFocusedTrigger && typeof lastFocusedTrigger.focus === 'function') {
          lastFocusedTrigger.focus();
        }
      }

      triggers.forEach((btn) => {
        btn.addEventListener('click', () => {
          const certId = btn.getAttribute('data-cert-id');
          openModal(certId, btn);
        });
      });

      closeBtn.addEventListener('click', closeModal);

      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) {
          closeModal();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (backdrop.hasAttribute('hidden')) return;

        if (event.key === 'Escape') {
          event.preventDefault();
          closeModal();
          return;
        }

        if (event.key === 'Tab') {
          const focusable = dialog.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
          );
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];

          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });
    }

    renderPortfolioApp();
  </script>
</body>
