  <script>
    (function initializeThemeBeforePaint() {
      try {
        var STORAGE_KEY = 'portfolio-theme';
        var savedTheme = localStorage.getItem(STORAGE_KEY);
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : prefersDark
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

    function ThemeToggle(buttonIdSuffix) {
      const currentTheme =
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const isDark = currentTheme === 'dark';

      return `
        <button
          type="button"
          id="theme-toggle-${buttonIdSuffix}"
          class="theme-toggle-btn js-theme-toggle"
          data-theme-toggle
          aria-pressed="${isDark ? 'true' : 'false'}"
          aria-label="Switch color theme. Current theme is ${isDark ? 'dark' : 'light'}."
          title="Toggle light or dark color theme"
        >
          <span class="js-theme-icon" aria-hidden="true" style="display:inline-flex;align-items:center;">
            ${getThemeIconSvg(currentTheme)}
          </span>
          <span class="js-theme-label">${isDark ? 'Dark' : 'Light'}</span>
        </button>
      `;
    }

      }
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

    function SiteNavigation(items, isMobile) {
      if (isMobile) {
        return `
          <nav aria-label="Mobile primary navigation">
            <ul class="mobile-nav-list">
              ${items
                .map(
                  (item, idx) => `
                <li>
                  <a
                    href="${item.href}"
                    class="mobile-nav-link js-mobile-nav-link"
                    data-section-target="${item.id}"
                    ${idx === 0 ? 'aria-current="location"' : ''}
                  >
                    <span>${item.label}</span>
                    <span aria-hidden="true" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-secondary);">→</span>
                  </a>
                </li>
              `
                )
                .join('')}
            </ul>
          </nav>
        `;
      }

      return `
        <nav aria-label="Primary navigation">
          <ul class="nav-list">
            ${items
              .map(
                (item, idx) => `
              <li>
                <a
                  href="${item.href}"
                  class="nav-link js-nav-link"
                  data-section-target="${item.id}"
                  ${idx === 0 ? 'aria-current="location"' : ''}

              </li>
            `
              )
              .join('')}
          </ul>
        </nav>

    }

    function getProjectCardHTML(project) {
      const badgeClass = {
        'Completed': 'completed-badge',
        'In Progress': 'in-progress-badge',
        'Planned': 'planned-badge'
      }[project.status] || 'unknown-badge';

      // Projects are only eligible to have clickable links if they are beyond the Planned phase
      const isLinkableStatus = project.status === 'Completed' || project.status === 'In Progress';
      const isExternal = project.href && project.href.startsWith('http');
      
      let footerContent = '';
      if (isLinkableStatus && project.href) {
        const ariaLabel = isExternal 
          ? (project.href.includes('datacamp.com') ? `View project details for ${project.title}, opens externally on DataCamp` : `View project details for ${project.title}, opens externally`)
          : `View project details for ${project.title}`;
          
        const noteLabel = isExternal ? 'External Project Link' : 'Case Study &amp; Architecture';

        footerContent = `
          <span class="editorial-item-note">${noteLabel}</span>
          <a href="${project.href}" class="project-card-link" aria-label="${ariaLabel}" ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}>
            <span>View project</span>
            <span aria-hidden="true">${isExternal ? '↗' : '→'}</span>
          </a>
        `;
      } else {
        const nonClickableLabel = project.status === 'Planned' ? 'Coming Soon' : 'Documentation in Progress';
        footerContent = `
          <span class="editorial-item-note">Case Study &amp; Architecture</span>
          <span class="project-coming-soon">${nonClickableLabel}</span>
        `;
      }

      return `
        <article class="project-card">
          <div>
            <div class="slot-meta-row">
              <span class="level-badge">Level: ${project.level}</span>
              <span class="${badgeClass}">${project.status}</span>
            </div>
            <h3 class="heading-card">${project.title}</h3>
            <p class="slot-copy">${project.problem}</p>
            <ul class="tech-badge-list" aria-label="${project.title} technology stack">
              ${project.techStack.map((tech) => `<li class="tech-badge">${tech}</li>`).join('')}
            </ul>
          </div>
          <div class="project-card-footer">
            ${footerContent}
          </div>
        </article>
      `;
    }

    function bindThemeToggles() {
      const toggleButtons = document.querySelectorAll('[data-theme-toggle]');

      function applyTheme(newTheme, persist) {
        document.documentElement.setAttribute('data-theme', newTheme);
        document.documentElement.style.colorScheme = newTheme;

        if (persist) {
          try {
            localStorage.setItem('portfolio-theme', newTheme);
          } catch (e) {
            // Ignore storage errors in restricted environments
          }
        }

        const isDark = newTheme === 'dark';
        toggleButtons.forEach((btn) => {
          btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
          btn.setAttribute(
            'aria-label',
            `Switch color theme. Current theme is ${isDark ? 'dark' : 'light'}.`
          );
          const iconSpan = btn.querySelector('.js-theme-icon');
          const labelSpan = btn.querySelector('.js-theme-label');
          if (iconSpan) iconSpan.innerHTML = getThemeIconSvg(newTheme);
          if (labelSpan) labelSpan.textContent = isDark ? 'Dark' : 'Light';
        });
      }

      toggleButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const current =
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
          const next = current === 'dark' ? 'light' : 'dark';
          applyTheme(next, true);
        });
      });
    }

    function bindMobileNavigation() {
      const menuBtn = document.getElementById('mobile-menu-toggle');
      const menuPanel = document.getElementById('mobile-navigation-panel');
      const menuLabel = document.getElementById('mobile-menu-label');
      const mobileLinks = document.querySelectorAll('.js-mobile-nav-link');

      if (!menuBtn || !menuPanel) return;

      function setMenuOpen(isOpen) {
        menuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        menuBtn.setAttribute(
          'aria-label',
          isOpen ? 'Close navigation menu' : 'Open navigation menu'
        );
        if (menuLabel) {
          menuLabel.textContent = isOpen ? 'Close' : 'Menu';
        }
        menuPanel.classList.toggle('is-open', isOpen);
      }

      menuBtn.addEventListener('click', () => {
        const currentlyOpen = menuBtn.getAttribute('aria-expanded') === 'true';
        setMenuOpen(!currentlyOpen);
      });

      mobileLinks.forEach((link) => {
        link.addEventListener('click', () => {
          setMenuOpen(false);
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && menuBtn.getAttribute('aria-expanded') === 'true') {
          setMenuOpen(false);
          menuBtn.focus();
        }
      });

      document.addEventListener('click', (event) => {
        const header = document.getElementById('site-header');
        if (
          header &&
          !header.contains(event.target) &&
          menuBtn.getAttribute('aria-expanded') === 'true'
        ) {
          setMenuOpen(false);
        }
      });
    }

    function bindScrollSpyNavigation() {
      const trackedIds = SITE_CONFIG.navigation.map((item) => item.id);
      const trackedSections = trackedIds
        .map((id) => document.getElementById(id))
        .filter(Boolean);
      const allNavLinks = document.querySelectorAll('.js-nav-link, .js-mobile-nav-link');
      const brandLinks = document.querySelectorAll('.js-brand-link');

      function setActiveSection(sectionId) {
        if (!sectionId || !trackedIds.includes(sectionId)) return;
        allNavLinks.forEach((link) => {
          if (link.getAttribute('data-section-target') === sectionId) {
            link.setAttribute('aria-current', 'location');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      }

      function evaluateScrollPosition() {
        if (!trackedSections.length) return;

        const scrollY = window.scrollY || window.pageYOffset;
        const viewportHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;

        if (scrollY + viewportHeight >= documentHeight - 24) {
          setActiveSection(trackedIds[trackedIds.length - 1]);
          return;
        }

        const activationOffset = 140;
        let resolvedId = trackedIds[0];

        for (let i = 0; i < trackedSections.length; i++) {
          const rect = trackedSections[i].getBoundingClientRect();
          if (rect.top <= activationOffset) {
            resolvedId = trackedSections[i].id;
          } else {
            break;
          }
        }

        setActiveSection(resolvedId);
      }

      allNavLinks.forEach((link) => {
        link.addEventListener('click', () => {
          const targetId = link.getAttribute('data-section-target');
          if (targetId) setActiveSection(targetId);
        });
      });

      brandLinks.forEach((link) => {
        link.addEventListener('click', () => {
          setActiveSection('hero');
        });
      });

      window.addEventListener('scroll', evaluateScrollPosition, { passive: true });
      window.addEventListener('resize', evaluateScrollPosition, { passive: true });
      window.addEventListener('hashchange', () => {
        const hashId = window.location.hash.replace('#', '');
        if (trackedIds.includes(hashId)) {
          setActiveSection(hashId);
        }
      });

      evaluateScrollPosition();
    }
    
    function bindProjectFilters() {
      const domainSelect = document.getElementById('filter-domain');
      const statusSelect = document.getElementById('filter-status');
      const grid = document.getElementById('project-catalogue-grid');
      const countEl = document.getElementById('filter-count');

      if (!domainSelect || !statusSelect || !grid || !countEl) return;

      // Dynamically extract unique domains
      const uniqueDomains = [...new Set(SITE_CONFIG.projects.items.map(p => p.domain).filter(Boolean))];
      
      // Build options safely using DOM methods
      const allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = 'All domains';
      
      const optionElements = [allOption];

      uniqueDomains.forEach(domain => {
        const opt = document.createElement('option');
        opt.value = domain;
        opt.textContent = domain;
        optionElements.push(opt);
      });

      // Inject the built options into the select element
      domainSelect.replaceChildren(...optionElements);

      function renderFilteredProjects() {
        const domainVal = domainSelect.value;
        const statusVal = statusSelect.value;

        const filtered = SITE_CONFIG.projects.items.filter((p) => {
          // Direct string comparison restored
          const matchDomain = domainVal === 'all' || p.domain === domainVal;
          const matchStatus = statusVal === 'all' || p.status === statusVal;
          return matchDomain && matchStatus;
        });

        countEl.textContent = `Showing ${filtered.length} project${filtered.length === 1 ? '' : 's'}`;

        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="empty-state-box">
              <p>No projects match the selected criteria.</p>
              <button type="button" class="btn-secondary js-reset-filters">Reset filters</button>
            </div>`;
          
          grid.querySelector('.js-reset-filters').addEventListener('click', () => {
            domainSelect.value = 'all';
            statusSelect.value = 'all';
            renderFilteredProjects();
          });
        } else {
          grid.innerHTML = filtered.map(getProjectCardHTML).join('');
        }
      }

      domainSelect.addEventListener('change', renderFilteredProjects);
      statusSelect.addEventListener('change', renderFilteredProjects);

      renderFilteredProjects(); // Initial render
    }

    function bindCertificationModal() {
      const backdrop = document.getElementById('certification-modal-backdrop');
      const dialog = document.getElementById('certification-modal');
      const closeBtn = document.getElementById('cert-modal-close');
      const triggers = document.querySelectorAll('.js-cert-modal-trigger');
      const mainContent = document.getElementById('main-content');
      const siteHeader = document.getElementById('site-header');
      const siteFooter = document.getElementById('site-footer');

      if (!backdrop || !dialog || !closeBtn) return;

      let lastFocusedTrigger = null;

      function setBackgroundInert(isInert) {
        [mainContent, siteHeader, siteFooter].forEach((el) => {
          if (!el) return;
          if (isInert) {
            el.setAttribute('inert', '');
            el.setAttribute('aria-hidden', 'true');
          } else {
            el.removeAttribute('inert');
            el.removeAttribute('aria-hidden');
          }
        });
      }

      function openModal(certId, triggerEl) {
        const cert = SITE_CONFIG.credentials.certifications.find((c) => c.id === certId);
        if (!cert) return;

        lastFocusedTrigger = triggerEl || document.activeElement;

        // Set the modal title
        document.getElementById('cert-modal-title').textContent = cert.name;

        // Inject the document into the modal body
        const container = document.getElementById('cert-modal-document-container');
        const docUrl = cert.documentPath; 
        
        let contentHtml = '';

        if (docUrl && docUrl.trim() !== '') {
          if (docUrl.toLowerCase().endsWith('.pdf')) {
            contentHtml += `<iframe src="${docUrl}" title="${cert.name} Certificate" class="document-frame"></iframe>`;
          } else {
            contentHtml += `<img src="${docUrl}" alt="${cert.name} Certificate" class="document-image" />`;
          }
        } else {
          contentHtml += `
            <div style="text-align:center; color:var(--text-secondary); font-family:var(--font-mono); font-size:var(--text-sm); padding: 2rem;">
              Certificate document pending.
            </div>`;
        }

        // External verification link 
        if (cert.verificationUrl && cert.verificationUrl.trim() !== '') {
          contentHtml += `
            <div style="text-align:center; margin-top: 1rem;">
               <a href="${cert.verificationUrl}" target="_blank" rel="noopener noreferrer" style="font-size: var(--text-sm); text-decoration: underline;">Verify Externally</a>
            </div>`;
        }

        container.innerHTML = contentHtml;

        backdrop.removeAttribute('hidden');
        document.body.classList.add('modal-open');
        setBackgroundInert(true);
        closeBtn.focus();
      }

      function closeModal() {
        if (backdrop.hasAttribute('hidden')) return;
        backdrop.setAttribute('hidden', '');
        document.body.classList.remove('modal-open');
        setBackgroundInert(false);
        
        // Clear the iframe immediately to free memory and stop it downloading in the background
        document.getElementById('cert-modal-document-container').innerHTML = '';

        if (lastFocusedTrigger && typeof lastFocusedTrigger.focus === 'function') {
          lastFocusedTrigger.focus();
        }
      }

      triggers.forEach((btn) => {
        btn.addEventListener('click', () => {
          const certId = btn.getAttribute('data-cert-id');
          openModal(certId, btn);
        });
      });

      closeBtn.addEventListener('click', closeModal);

      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) {
          closeModal();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (backdrop.hasAttribute('hidden')) return;

        if (event.key === 'Escape') {
          event.preventDefault();
          closeModal();
          return;
        }

        if (event.key === 'Tab') {
          const focusable = dialog.querySelectorAll(
            'button, [href], input, select, textarea, iframe, [tabindex]:not([tabindex="-1"])'
          );
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];

          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });
    }

    renderPortfolioApp();
  </script>
</body>
</html>
